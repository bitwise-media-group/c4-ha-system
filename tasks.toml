#
# Repo-local tasks. Included after the toolchain's common/tasks.toml (see
# mise.toml), so the fmt/lint/ci/pr rollups here replace common's whole-task:
# fmt and lint repeat common's rollups and append the Lua steps, and build/test
# are canonical task names, so the reusable CI workflow discovers and runs them.
#
# Included task files use the simplified format: top-level keys ARE task names.

[fmt-lua]
hide = true
description = "format Lua with stylua"
dir = "{{config_root}}"
run = "stylua lib drivers tests"

[lint-lua]
hide = true
description = "lint Lua with selene + stylua --check"
dir = "{{config_root}}"
run = ["selene lib drivers tests", "stylua --check lib drivers tests"]

[fmt]
description = "format prose, inject license headers, format Lua"
run = [{ task = "fmt-prose" }, { task = "license" }, { task = "fmt-lua" }]

[lint]
description = "prose lint + license, container, shell and workflow checks, plus Lua lint (selene + stylua)"
run = [
  { task = "license-check" },
  { task = "lint-containers" },
  { task = "lint-shell" },
  { task = "lint-workflows" },
  { task = "lint-prose" },
  { task = "lint-lua" },
]

[build]
description = "assemble dist/<name>.c4z driver packages"
dir = "{{config_root}}"
run = "sh scripts/build.sh"

[test]
description = "run the C4-stubbed driver test suites"
dir = "{{config_root}}"
run = "sh scripts/test.sh"

[ci]
description = "the gates the reusable CI workflow runs"
run = [{ task = "lint" }, { task = "test" }, { task = "build" }]

# common's pr has no commit step, so neither does this one.
[pr]
description = "full local gate before a pull request"
run = [{ task = "fmt" }, { task = "lint" }, { task = "test" }, { task = "build" }]
