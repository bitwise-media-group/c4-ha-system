#
# Repo-local tasks. Included after the markdown-lib archetype (see mise.toml),
# so the fmt/lint/ci/pr aggregates here replace the archetype's and weave the
# Lua steps in with the universal prose/license/shell passes.
#
# Included task files use the simplified format: top-level keys ARE task names.

[fmt-lua]
hide = true
description = "format Lua with stylua"
dir = "{{config_root}}"
run = "stylua lib drivers tests"

[lint-lua]
hide = true
description = "lint Lua with selene + stylua --check"
dir = "{{config_root}}"
run = ["selene lib drivers tests", "stylua --check lib drivers tests"]

[fmt]
description = "format Lua, prose; inject license headers"
run = [{ task = "fmt-lua" }, { task = "fmt-prose" }, { task = "license" }]

[lint]
description = "Lua lint (selene + stylua) + prose/shell/container/license checks"
run = [
  { task = "license-check" },
  { task = "lint-containers" },
  { task = "lint-shell" },
  { task = "lint-prose" },
  { task = "lint-lua" },
]

[build]
description = "assemble dist/<name>.c4z driver packages"
dir = "{{config_root}}"
run = "sh scripts/build.sh"

[test]
description = "run the C4-stubbed driver test suites"
dir = "{{config_root}}"
run = "sh scripts/test.sh"

[ci]
description = "the gates the reusable CI workflow runs"
run = [{ task = "lint" }, { task = "build" }, { task = "test" }]

[pr]
description = "full local gate before a pull request"
run = [
  { task = "fmt" },
  { task = "lint" },
  { task = "build" },
  { task = "test" },
  { task = "commit" },
]
